# /docker-compose.yml
version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: boutique_market_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: boutique_market
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Si quieres que se cree la estructura base automáticamente:
      - ./backend/estructura_base.sql:/docker-entrypoint-initdb.d/estructura_base.sql
    restart: always

  backend:
    build:
      context: ./backend
    container_name: boutique_market_api
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=boutique_market
      - PORT=3000
    depends_on:
      - db
    restart: always

  frontend:
    build:
      context: ./frontend
    container_name: boutique_market_ui
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: always

volumes:
  db_data: