# Blueprint de despliegue para Render (https://render.com)
# Proyecto: ARIEL — Sistema de gestión personal
#
# INSTRUCCIONES:
#   1. Ve a https://render.com → New → Blueprint
#   2. Conecta este repositorio y selecciona la rama: proyecto-ariel
#   3. Las variables con `sync: false` debes configurarlas manualmente
#      en el dashboard de Render (Environment → Add Secret)
#
# Variables que DEBES rellenar manualmente:
#   - DATABASE_URL_ARIEL  → connection string de Supabase (URI mode, port 6543)
#   - JWT_SECRET          → openssl rand -hex 64
#   - ENCRYPTION_KEY      → exactamente 32 caracteres aleatorios
#   - ALLOWED_ORIGINS     → URL de tu frontend en Vercel (ej: https://ariel-market.vercel.app)

services:
  - type: web
    name: ariel-api
    runtime: node
    region: frankfurt
    plan: free
    branch: proyecto-ariel
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: ALLOW_PUBLIC_REGISTER
        value: "false"
      - key: ALLOWED_ORIGINS
        sync: false   # https://ariel-market.vercel.app  (URL de Vercel — sin barra final)
      - key: JWT_SECRET
        sync: false   # genera con: openssl rand -hex 64
      - key: DATABASE_URL_ARIEL
        sync: false   # Supabase → Project Settings → Database → Connection string → URI (port 6543)
      - key: ENCRYPTION_KEY
        sync: false   # exactamente 32 caracteres aleatorios
