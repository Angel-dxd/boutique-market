<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marquez Family Business</title>
    <link href="/css/output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .view-transition {
            animation: turboFade 0.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            will-change: opacity, transform;
        }

        @keyframes turboFade {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>

</head>

<body class="bg-gray-100 text-slate-900 transition-colors duration-200">

    <!-- Root Container -->
    <div id="app" class="min-h-screen">
        <!-- Views will be rendered here -->
    </div>

    <!--
        Configuración de URL de la API.
        - En desarrollo local (hostname = localhost) → api.js cae a http://localhost:3000/api.
        - En producción (Vercel) → se usa la URL pública del backend en Render.
        Sustituye la URL siguiente por la de tu servicio de Render antes del primer deploy.
    -->
    <script>
        window.__API_URL__ = window.location.hostname === 'localhost'
            ? null
            : 'https://boutique-market-api.onrender.com/api';
    </script>

    <!-- Modules are loaded here. We use type="module" to use ES6 imports -->
    <script type="module" src="/js/features/core/app.js"></script>
</body>

</html>
